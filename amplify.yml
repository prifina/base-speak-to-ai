version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env
        - env | grep -e MY_ACCESS_KEY >> .env.production
        - env | grep -e MY_SECRET_KEY >> .env.production
        - env | grep -e MY_REGION >> .env.production
        - env | grep -e CAPTCHA_SECRET_KEY >> .env.production
        - env | grep -e CORE_API_URL >> .env.production
        - env | grep -e CORE_API_KEY >> .env.production
        - env | grep -e TIMER_API_URL >> .env.production
        - env | grep -e TIMER_API_KEY >> .env.production
        - env | grep -e COGNITO_USER_POOL_ID >> .env.production
        - env | grep -e COGNITO_CLIENT_ID >> .env.production
        - env | grep -e COGNITO_IDENTITY_POOL_ID >> .env.production
        - env | grep -e GRAPHQL_API >> .env.production
        - env | grep -e SPEAK_TO_CDN >> .env.production
        - env | grep -e UPLOAD_BUCKET >> .env.production
        - env | grep -e NEXT_PUBLIC_SPEAK_TO_USER >> .env.production
        - env | grep -e NEXT_PUBLIC_APP_ID >> .env.production
        - env | grep -e NEXT_PUBLIC_CAPTCHA_SITE_KEY >> .env.production
        - env | grep -e WEB_SOCKET_URL >> .env.production
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
