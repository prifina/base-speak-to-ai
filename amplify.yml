version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -e "MY_" >> .env.production
        - env | grep -e "CORE_API_" >> .env.production
        - env | grep -e "TIMER_API_" >> .env.production
        - env | grep -e "COGNITO_" >> .env.production
        - echo "UPLOAD_BUCKET=$UPLOAD_BUCKET" >> .env.production
        - echo "WEB_SOCKET_URL=$WEB_SOCKET_URL" >>.env.production
        - echo "SPEAK_TO_CDN=$SPEAK_TO_CDN" >> .env.production
        - echo "TELEMETRY_API_KEY=$TELEMETRY_API_KEY" >> .env.production
        - echo "GRAPHQL_API=$GRAPHQL_API" >> .env.production
        - echo "AB_SECRET=$AB_SECRET" >> .env.production
        - env | grep -e "NEXT_PUBLIC_" >> .env.production
        - npm run build
    postBuild:
      commands:
        - node scripts/upload-sourcemaps.js

  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
